name: Nachrichten aktualisieren
on:
  schedule:
    - cron: "0 5 * * *"   # täglich ca. 06:00/07:00 Uhr deutscher Zeit
  workflow_dispatch:       # manuell auslösbar
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional
      - name: Änderungen committen
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update $(date +%F)" && git push
